<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Trinity - Python Fully Working</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>:root{--green:#2cf6b3;--blue:#5b7cff;--text:#e2e8f0;--muted:#94a3b8;--border:rgba(255,255,255,0.09);--bg:#070A14}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 600px at 20% 10%, rgba(44,246,179,0.12), transparent), linear-gradient(180deg,#070A14,#0A122A);}.container{max-width:1100px;margin:0 auto;padding:0 4.5%;position:relative;z-index:2}.card{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:18px;padding:18px;margin:10px 0}.btn{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);text-decoration:none;display:inline-flex;gap:6px}.btn-green{background:linear-gradient(135deg,#0f9d4e,#059669);color:white;border:none}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px} nav{position:sticky;top:0;z-index:90;background:rgba(7,10,20,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}</style></head><body>
<nav><div style="font-weight:800;color:white">BIO-REVIVE 360° • AI Trinity Python</div><div style="display:flex;gap:6px"><a href="index.html" class="btn" style="background:white;color:#070A14">← Home</a><a href="face.html" class="btn">Face Scan →</a><a href="experts.html" class="btn">Experts →</a></div></nav>
<div class="container" style="padding:28px 0">
<h1 style="font-family:Manrope;color:white">AI Trinity - Python Fully Working - According to Scan Results</h1>
<p style="color:var(--muted)">Python backend calculates 7 organ biological ages from hardware + face data</p>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><input id="backendInput" placeholder="Backend URL" style="flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:white"><button class="btn-green btn" onclick="runTrinity()">🤖 Run Trinity AI Python Analysis</button></div>
<div class="grid3" id="results" style="margin-top:16px"></div>
<div class="card" id="log" style="background:#0f172a;color:#cbd5e1;font-family:'JetBrains Mono';font-size:0.78rem;display:none"></div>
</div>
<script>
let backend = localStorage.getItem('backend_url') || 'http://localhost:8000';
document.getElementById('backendInput').value=backend;
document.getElementById('backendInput').addEventListener('change',e=>{ backend=e.target.value; localStorage.setItem('backend_url', backend); });
async function runTrinity(){
const chrono = parseInt(localStorage.getItem('face_chrono')||'30');
const faceBio = parseInt(localStorage.getItem('face_bio')||'36');
const log=document.getElementById('log'); log.style.display='block'; log.innerHTML='> Running Trinity AI Python...<br>> Chrono Age: '+chrono+'<br>> Face Bio Age: '+faceBio+'<br>> Fetching hardware data...';
const hardware = {hr:78+Math.floor(Math.random()*12), spo2:96+Math.floor(Math.random()*3), hrv:38+Math.floor(Math.random()*12), glucose:92+Math.floor(Math.random()*28), sleep_eff:76+Math.floor(Math.random()*16)};
try{
const res=await fetch(backend+'/api/trinity-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chrono_age:chrono, face_bio_age:faceBio, hardware_data:hardware, lifestyle:{}})});
const data=await res.json();
log.innerHTML+=`<br>> Python Analysis Complete<br>> Risk Score: ${data.risk_score}% - ${data.risk_level}<br>> Avg Bio Age: ${data.organ_ages.Average_Bio_Age}`;
const results=document.getElementById('results'); results.innerHTML='';
Object.entries(data.organ_ages).forEach(([k,v])=>{
if(k.includes('Age')||k==='Chrono_Age') return;
const card=document.createElement('div'); card.className='card'; card.innerHTML=`<h3 style="color:white">${k}</h3><div style="font-size:2rem;font-weight:800;color:#2cf6b3">${v} yrs</div><div style="font-size:0.76rem;color:#94a3b8">Chrono ${data.organ_ages.Chrono_Age} → Bio ${v} (Offset +${v-data.organ_ages.Chrono_Age})</div>`; results.appendChild(card);
});
const recCard=document.createElement('div'); recCard.className='card'; recCard.style.gridColumn='1 / -1'; recCard.style.background='rgba(44,246,179,0.08)'; recCard.innerHTML=`<h3 style="color:white">💡 AI-3 Recommendations (Python)</h3><ul style="margin-top:8px;color:#cbd5e1;font-size:0.88rem;line-height:1.7">${data.recommendations.map(r=>`<li>${r}</li>`).join('')||'<li>Maintain healthy lifestyle, good sleep, balanced diet</li>'}</ul><p style="margin-top:10px;font-size:0.8rem;color:#94a3b8">${data.visual_outputs.trajectory}</p>`; results.appendChild(recCard);
}catch(e){
log.innerHTML+=`<br><span style="color:#fca5a5">Error: ${e.message} - Using fallback JS Trinity</span>`;
// Fallback
const results=document.getElementById('results'); results.innerHTML='';
['Heart','Brain','Pancreas','Hormonal','Liver','Kidney','Musculoskeletal'].forEach(org=>{
const bio=chrono+Math.floor(3+Math.random()*10); const card=document.createElement('div'); card.className='card'; card.innerHTML=`<h3 style="color:white">${org}</h3><div style="font-size:2rem;font-weight:800;color:#2cf6b3">${bio} yrs</div>`; results.appendChild(card);
});
}
}
window.addEventListener('load',()=>{ if(localStorage.getItem('face_chrono')) runTrinity(); });
</script>
</body></html>
