let tok=0;function speak(txt,done){const my=++tok;let fin=false;const end=()=>{if(fin||my!==tok)return;fin=true;clearTimeout(tm);done&&done()},tm=setTimeout(end,Math.max(8000,txt.length*95));

/* ---------- tour logic ---------- */
let step=-1,playing=false,spin=true,rot=0,tgtRot=null,camZ=11,tgtZ=11,ca=0,cp2=.12,dr=0,lx=0,ly=0,cin=false,tmN=null;
$('chips').innerHTML=TM.map((m,i)=>`<div class="chip" data-i="${i}"><img src="${IMG[m.k]}" alt=""><span>${m.n.split(' ')[0]}</span></div>`).join('');
function flash(){const f=$('fl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');whoosh()}
function show(i){const c=$('pc');if(i<1||i>4){c.classList.remove('show');return}const m=TM[i-1];$('pi').src=IMG[m.k];$('pn').textContent=m.n;$('pr').textContent=m.r;$('pd').textContent=m.id+' · JRU RANCHI';c.classList.remove('show');void c.offsetWidth;setTimeout(()=>c.classList.add('show'),260)}
function play(i){clearTimeout(tmN);if(i<0)i=0;if(i>=SC.length){playing=false;step=-1;$('cap').textContent='Tour complete · press ⏭ or a member to replay';tgtRot=null;tgtZ=11;show(0);$('bp').textContent='▶ Play';document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));return}
 step=i;playing=true;$('bp').textContent='⏸ Pause';document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j==i-1));const m=SC[i];
 if(i>=1&&i<=4){tgtRot=-(i-1)*PI/2;tgtZ=7.6;flash();setTimeout(()=>show(i),150)}else{tgtRot=null;tgtZ=i?10:11;show(0);if(i==5)flash()}
 $('cap').style.opacity=0;setTimeout(()=>{$('cap').textContent=m.t;$('cap').style.opacity=1},300);

$('bp').onclick=()=>{audio();playing?pause():play(step<0?0:step)};$('bn').onclick=()=>{audio();play(step+1>=SC.length?0:step+1)};$('bv').onclick=()=>{audio();play(Math.max(0,step-1))};
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(c){audio();play(+c.dataset.i+1)}};
$('br').onclick=()=>{spin=!spin;$('br').classList.toggle('on',spin)};$('bs').onclick=()=>{audio();snd=!snd;$('bs').classList.toggle('on',snd);if(MG)MG.gain.value=snd?$('vl').value/100*.6:0};
$('bm').onclick=()=>{vox=!vox;$('bm').classList.toggle('on',vox);if(!vox&&'speechSynthesis' in window)speechSynthesis.cancel()};$('vl').oninput=()=>{if(MG&&snd)MG.gain.value=$('vl').value/100*.6};
function cinema(v){cin=v===undefined?!cin:v;document.body.classList.toggle('cin',cin);$('bc').classList.toggle('on',cin);const d=document.documentElement;if(cin){(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);poke()}else if(document.fullscreenElement)document.exitFullscreen()}

$('bc').onclick=()=>cinema();addEventListener('pointermove',poke);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&cin)cinema(false)});
addEventListener('keydown',e=>{const k=e.key;if(k=='c'||k=='C')cinema();else if(k=='Escape'&&cin)cinema(false);else if(k==' '){e.preventDefault();$('bp').onclick()}else if(k=='ArrowRight')$('bn').onclick();else if(k=='ArrowLeft')$('bv').onclick();else if(k=='r'||k=='R')$('br').onclick();else if(k=='m'||k=='M')$('bs').onclick()});
cv.addEventListener('pointerdown',e=>{dr=1;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});cv.addEventListener('pointerup',()=>{dr=0;cv.style.cursor='grab'});
cv.addEventListener('pointermove',e=>{if(!dr)return;ca-=(e.clientX-lx)*.006;cp2=Math.max(-.6,Math.min(.8,cp2+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
cv.addEventListener('wheel',e=>{tgtZ=Math.max(6,Math.min(18,tgtZ+e.deltaY*.01))},{passive:true});
/* ---------- render loop ---------- */
let last=0;function frame(ms){requestAnimationFrame(frame);const dt=Math.min((ms-last)/1000,.05),t=ms/1000;last=ms;const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!=Math.round(w*R.getPixelRatio())||cv.height!=Math.round(h*R.getPixelRatio())){R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}
 planet.rotation.y+=dt*.08;clouds.rotation.y+=dt*.105;moon.position.set(Math.cos(t*.25)*3.9,Math.sin(t*.25)*.5,Math.sin(t*.25)*3.9);stars.rotation.y+=dt*.004;
 if(tgtRot!==null){let d=((tgtRot-rot)%(PI*2)+PI*3)%(PI*2)-PI;rot+=d*(1-Math.exp(-dt*2.2));if(!dr)ca*=Math.exp(-dt*1.4)}else if(spin)rot+=dt*.22;
 G.rotation.y=rot;camZ+=(tgtZ-camZ)*(1-Math.exp(-dt*2));
 panels.forEach((p,i)=>{const f=step==i+1;p.fr.material.opacity=f?.8+.2*Math.sin(t*6):.3;p.g.scale.setScalar(f?1.08:1)});
 C.position.set(Math.sin(ca)*Math.cos(cp2)*camZ,Math.sin(cp2)*camZ+.3,Math.cos(ca)*Math.cos(cp2)*camZ);C.lookAt(0,0,0);
 SH.forEach(s=>{s.t-=dt;if(s.t<0){s.t=5+Math.random()*9;s.p=0;s.x=(Math.random()-.5)*160;s.y=40+Math.random()*60;s.z=-150-Math.random()*50}if(s.p!==undefined&&s.p<1){s.p+=dt*1.4;s.l.position.set(s.x-s.p*80,s.y-s.p*30,s.z);s.l.rotation.z=.36;s.l.material.opacity=Math.sin(s.p*PI)*.9}else s.l.material.opacity=0});
 R.render(S,C)}
requestAnimationFrame(frame);
