<!DOCTYPE html>
<html>
<head>
  <title>BIO Revive Live Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:Arial;background:#f5fff5;padding:20px}
    .card{background:white;padding:15px;border-radius:10px;margin:10px;box-shadow:0 2px 10px #ccc;display:inline-block;min-width:120px;text-align:center}
    .val{font-size:28px;font-weight:bold;color:green}
  </style>
</head>
<body>
  <h1>🌿 BIO Revive 360° - Live Sensor Data</h1>
  <a href="index.html">← Back to Home</a>
  <div id="status" style="color:green;margin:10px">● Live</div>
  
  <div>
    <div class="card">pH<div class="val" id="phVal">--</div></div>
    <div class="card">Temp<div class="val" id="tempVal">-- °C</div></div>
    <div class="card">Moisture<div class="val" id="moistVal">-- %</div></div>
  </div>
  <canvas id="liveChart" style="max-width:800px;margin-top:20px"></canvas>

<script>
const DB_URL = "https://biorevive-360-default-rtdb.asia-southeast1.firebasedatabase.app/biorevive360/sensors.json";

const ctx = document.getElementById('liveChart');
const chart = new Chart(ctx, {
  type: 'line',
  data: { labels: [], datasets: [
    {label:'pH', data:[], borderColor:'green'},
    {label:'Temp', data:[], borderColor:'red'},
    {label:'Moisture', data:[], borderColor:'blue'}
  ]},
  options: { responsive:true }
});

async function fetchLive(){
  try{
    const res = await fetch(DB_URL + "?t=" + Date.now());
    const d = await res.json();
    if(!d) return;
    document.getElementById('phVal').innerText = d.ph;
    document.getElementById('tempVal').innerText = d.temp + " °C";
    document.getElementById('moistVal').innerText = d.moisture + " %";
    document.getElementById('status').innerText = "● Live - Updated: " + new Date().toLocaleTimeString();

    const time = new Date().toLocaleTimeString();
    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(d.ph);
    chart.data.datasets[1].data.push(d.temp);
    chart.data.datasets[2].data.push(d.moisture);
    if(chart.data.labels.length > 20){ chart.data.labels.shift(); chart.data.datasets.forEach(ds=>ds.data.shift()); }
    chart.update();
  }catch(e){
    document.getElementById('status').innerText = "● Error: " + e.message;
    console.log(e);
  }
}

fetchLive();
setInterval(fetchLive, 3000); // refresh every 3 sec like real sensor
</script>
</body>
</html>
