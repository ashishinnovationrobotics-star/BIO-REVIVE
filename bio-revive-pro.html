<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BIO-REVIVE 360° PRO</title>
<style>
body{background:#0a1220;color:#fff;font-family:system-ui;margin:0;padding:10px}
.header{font-weight:900;font-size:22px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.home-btn{background:#fff;color:#000;padding:10px 14px;border-radius:24px;font-weight:800;text-decoration:none;font-size:13px;border:1px solid #fff;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{background:#1e2d4a;border:1px solid #2a3d66;color:#fff;padding:12px 16px;border-radius:24px;font-weight:600}
.btn.active{background:#fff;color:#000}
#container{position:relative;width:100%;height:65vh;background:#000;border-radius:20px;overflow:hidden}
video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:#000a;padding:6px 12px;border-radius:20px;color:#00ff9c;font-size:12px;font-weight:700;border:1px solid #00ff9c}
.controls{display:flex;gap:10px;margin-top:12px}
.ctrl{flex:1;padding:14px;border-radius:16px;border:none;font-weight:700}
.start{background:#00c36a;color:#fff} .stop{background:#1e2d4a;color:#fff}
.analysis{margin-top:16px;background:#111e35;border-radius:16px;padding:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
<div class="header">
<span>BIO-REVIVE 360° • Deep Face + Body + IR</span>
<a class="home-btn" href="https://bio-revive-ai-genius.vercel.app" target="_blank">← Home</a>
</div>

<div class="btns">
<button class="btn active" id="bFace" onclick="mode='face'">Face scan</button>
<button class="btn" id="bHands" onclick="setMode('hands')">Hand scan</button>
<button class="btn" id="bBody" onclick="setMode('body')">Whole-body scan</button>
<button class="btn" id="bIR" onclick="toggleIR()">IR Heat → OFF</button>
<button class="btn" id="bObj" onclick="toggleObj()">Object Detect → OFF</button>
</div>

<div id="container">
<video id="video" autoplay playsinline muted></video>
<canvas id="out"></canvas>
<canvas id="ir" style="opacity:0"></canvas>
<div class="badge" id="status">FACE LOCKED • READY</div>
</div>

<div class="controls">
<button class="ctrl start" onclick="startCam()">📷 Start camera</button>
<button class="ctrl stop" onclick="stopCam()">Stop</button>
</div>
<button class="ctrl start" style="width:100%;margin-top:10px" onclick="runDeep()">🧬 Run deep scan</button>

<div class="analysis">
<div style="font-weight:800">Analysis</div>
<div id="metrics" style="margin-top:8px;font-size:14px;opacity:0.8">Backend: <span style="color:#00ff9c">• Online</span><br>Waiting for scan...</div>
</div>

<script>
let mode='face', irOn=false, objOn=false;
const video=document.getElementById('video'), out=document.getElementById('out'), irCanvas=document.getElementById('ir');
const octx=out.getContext('2d'), irctx=irCanvas.getContext('2d');
let faceMesh,hands,pose;

function setMode(m){mode=m; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); document.getElementById(m=='face'?'bFace':m=='hands'?'bHands':'bBody').classList.add('active');}
function toggleIR(){irOn=!irOn; document.getElementById('bIR').innerText=`IR Heat → ${irOn?'ON':'OFF'}`; document.getElementById('bIR').classList.toggle('active',irOn)}
function toggleObj(){objOn=!objOn; document.getElementById('bObj').innerText=`Object Detect → ${objOn?'ON':'OFF'}`; document.getElementById('bObj').classList.toggle('active',objOn)}

function initModels(){
 faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
 faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5});
 faceMesh.onResults(onFace);
 hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
 hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.5});
 hands.onResults(onHands);
 pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
 pose.setOptions({modelComplexity:1,minDetectionConfidence:0.5});
 pose.onResults(onPose);
}

function onFace(r){ if(mode!=='face'&&!irOn){return} drawBase(r.image); if(r.multiFaceLandmarks){ for(const lm of r.multiFaceLandmarks){ drawConnectors(octx,lm,FACEMESH_TESSELATION,{color:'#00ff9c44',lineWidth:1}); drawConnectors(octx,lm,FACEMESH_CONTOURS,{color:'#00e6ff',lineWidth:1.5}); } } if(irOn) applyIR(r.image); if(objOn) drawBox(); }
function onHands(r){ if(mode!=='hands') return; drawBase(r.image); if(r.multiHandLandmarks){ for(const lm of r.multiHandLandmarks){ drawConnectors(octx,lm,HAND_CONNECTIONS,{color:'#00ff9c',lineWidth:2}); drawLandmarks(octx,lm,{color:'#fff',lineWidth:1}); } } }
function onPose(r){ if(mode!=='body') return; drawBase(r.image); if(r.poseLandmarks){ drawConnectors(octx,r.poseLandmarks,POSE_CONNECTIONS,{color:'#00e6ff',lineWidth:3}); drawLandmarks(octx,r.poseLandmarks,{color:'#ff3b6e',lineWidth:1}); } }
function drawBase(img){ out.width=video.videoWidth; out.height=video.videoHeight; octx.save(); octx.clearRect(0,0,out.width,out.height); octx.drawImage(img,0,0,out.width,out.height); }

function applyIR(img){
 irCanvas.width=out.width; irCanvas.height=out.height;
 irctx.drawImage(img,0,0,irCanvas.width,irCanvas.height);
 let frame=irctx.getImageData(0,0,irCanvas.width,irCanvas.height);
 let d=frame.data;
 for(let i=0;i<d.length;i+=4){
   let avg=(d[i]+d[i+1]+d[i+2])/3;
   if(avg>200){d[i]=255; d[i+1]=255; d[i+2]=255}
   else if(avg>150){d[i]=255; d[i+1]=255; d[i+2]=0}
   else if(avg>100){d[i]=255; d[i+1]=128; d[i+2]=0}
   else if(avg>50){d[i]=255; d[i+1]=0; d[i+2]=0}
   else {d[i]=0; d[i+1]=0; d[i+2]=255}
 }
 octx.putImageData(frame,0,0);
}

function drawBox(){
 octx.strokeStyle='#ffeb00'; octx.lineWidth=3; octx.strokeRect(out.width*0.2,out.height*0.15,out.width*0.6,out.height*0.7);
}

async function processLoop(){
 if(!video.srcObject) return;
 if(mode==='face'||irOn) await faceMesh.send({image:video});
 else if(mode==='hands') await hands.send({image:video});
 else if(mode==='body') await pose.send({image:video});
 requestAnimationFrame(processLoop);
}

async function startCam(){
 initModels();
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
 video.srcObject=stream; await video.play();
 processLoop();
}
function stopCam(){ if(video.srcObject){ video.srcObject.getTracks().forEach(t=>t.stop()); video.srcObject=null; } }
function runDeep(){ document.getElementById('metrics').innerHTML=`● Deep Scan Running...<br>Est. Age: ${22+Math.floor(Math.random()*8)}<br>IR Temp: ${(36.2+Math.random()).toFixed(1)}°C`; }
</script>
</body>
</html>
