<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinematic Team Tour · Bio-Revive 360° · JRU Ranchi</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;600&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:#fff;font:14px Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:#05070d}
#cam{position:absolute;left:0;top:0;width:2048px;height:1152px;transform-origin:0 0;transition:transform 3.6s cubic-bezier(.45,0,.2,1);will-change:transform}
#cam img{width:100%;height:100%;display:block;filter:brightness(.93) contrast(1.06) saturate(1.12);animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.035) translate(-.6%,-.4%)}}
.ov{position:fixed;inset:0;pointer-events:none}
#grade{z-index:3;background:linear-gradient(135deg,rgba(0,70,100,.22),rgba(140,40,20,.14));mix-blend-mode:multiply}
#vig{z-index:4;background:radial-gradient(ellipse at 50% 46%,transparent 28%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.9) 100%)}
#grain{z-index:5;opacity:.09;background-size:160px;animation:gr .7s steps(6) infinite}@keyframes gr{0%{background-position:0 0}20%{background-position:-40px 30px}40%{background-position:60px -20px}60%{background-position:-20px -60px}80%{background-position:50px 40px}100%{background-position:0 0}}
#dust{z-index:6}
#sw{z-index:7;background:linear-gradient(100deg,transparent 35%,rgba(255,240,210,.75) 50%,transparent 65%);transform:translateX(-120%);mix-blend-mode:screen}#sw.go{animation:sw 1.1s ease-out}@keyframes sw{to{transform:translateX(120%)}}
.bar{position:fixed;left:0;right:0;height:6vh;background:#000;z-index:20;transition:height .9s cubic-bezier(.65,0,.35,1)}#bt{top:0}#bb{bottom:0}
#lt{position:fixed;left:5vw;bottom:calc(6vh + 110px);z-index:12;max-width:min(560px,86vw);opacity:0;transform:translateX(-30px);transition:all 1s cubic-bezier(.2,.8,.2,1);border-left:3px solid #e0b25c;padding:4px 0 4px 16px;text-shadow:0 2px 20px #000}
#lt.show{opacity:1;transform:none}#lt small{display:block;font:600 11px Inter;letter-spacing:.32em;color:#e0b25c}#lt b{display:block;font:700 clamp(24px,4vw,46px)/1.1 Cinzel,serif;margin:4px 0}#lt span{display:block;font:600 clamp(13px,1.6vw,18px) Inter;color:#d9e8f2}#lt em{font:normal 600 12px Inter;color:#8fb4c9;letter-spacing:.16em}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6vh + 62px);z-index:12;width:min(860px,92vw);text-align:center;font:italic 400 clamp(13px,1.7vw,20px)/1.45 Inter;text-shadow:0 2px 16px #000,0 0 3px #000;transition:opacity .35s;min-height:30px}
#top{position:fixed;top:6vh;left:0;right:0;z-index:12;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;pointer-events:none}#top>*{pointer-events:auto}
#top b{font:700 12px Cinzel,serif;letter-spacing:.22em;color:#e0b25c;text-shadow:0 1px 8px #000}
.btn{font:600 12px Inter;padding:8px 14px;border-radius:999px;border:1px solid rgba(224,178,92,.6);background:rgba(8,10,18,.72);color:#fbeed2;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);white-space:nowrap}.btn:hover{background:rgba(224,178,92,.2)}.btn.on{background:#e0b25c;color:#1b1204}
#dock{position:fixed;left:0;right:0;bottom:calc(6vh + 8px);z-index:14;display:flex;flex-direction:column;gap:7px;align-items:center;transition:opacity .5s}.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;padding:0 8px}
input[type=range]{accent-color:#e0b25c;width:80px}#pg{position:fixed;left:0;bottom:6vh;height:2px;width:0;background:linear-gradient(90deg,#e0b25c,#b3202a);z-index:21;transition:width .5s}
body.cin .bar{height:12vh}body.cin #top,body.cin #dock{opacity:0;pointer-events:none}body.cin #lt{bottom:calc(12vh + 90px)}body.cin #cap{bottom:calc(12vh + 40px);font-size:clamp(15px,2vw,24px)}body.cin #pg{bottom:12vh}body.cin.idle{cursor:none}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.82)),url(team_page.png) center/cover;transition:opacity 1s}#start.hide{opacity:0;pointer-events:none}
#start small{font:600 11px Inter;letter-spacing:.4em;color:#e0b25c}#start h1{font:700 clamp(28px,6vw,64px)/1.05 Cinzel,serif;margin:12px 0;text-shadow:0 4px 30px #000}#start p{color:#c4d3de;max-width:520px;margin:0 auto 22px;line-height:1.6}
</style></head><body>
<div id="stage"><div id="cam"><img src="team_page.png" alt="Team Bio-Revive 360 · JRU Ranchi"></div></div>
<div class="ov" id="grade"></div><div class="ov" id="vig"></div><div class="ov" id="grain"></div><canvas class="ov" id="dust"></canvas><div class="ov" id="sw"></div>
<div class="bar" id="bt"></div><div class="bar" id="bb"></div><i id="pg"></i>
<div id="top"><b>BIO-REVIVE 360° · THE TEAM</b><a class="btn" href="team.html">← Team Page</a></div>
<div id="lt"></div><div id="cap"></div>
<div id="dock"><div class="row" id="chips"></div><div class="row"><button class="btn" id="bp">⏸ Pause</button><button class="btn" id="bv">⏮</button><button class="btn" id="bn">⏭</button><button class="btn" id="bc">🎬 Cinema</button><button class="btn on" id="bs">♫ Score</button><button class="btn on" id="bm">🗣 Voice</button><label>Vol <input id="vl" type="range" min="0" max="100" value="70"></label></div></div>
<div id="start"><div><small>JHARKHAND RAI UNIVERSITY · RANCHI · MCA 2026</small><h1>Meet the Team<br>Behind Bio-Revive 360°</h1><p>A cinematic tour of the four people who built the project. A voice guide explains each person's role, with an original film score.</p><button class="btn on" id="go" style="font-size:15px;padding:14px 32px">▶ Begin Cinematic Tour</button></div></div>
<script>
const $=i=>document.getElementById(i);
const mem=(n,id,r,cx,t)=>({ch:'',n,id,r,t,cams:[[0,cx,745,560,470],[4500,cx,650,320,330],[11500,cx,905,240,430]]});
const SC=[{ch:'PROLOGUE',n:'Team Bio-Revive 360°',id:'',r:'Futuristic Health AI Lab · JRU Ranchi',t:'Welcome to Team Bio-Revive 360, the Futuristic Health AI Lab at Jharkhand Rai University, Ranchi, in the Department of Computer Applications. Our project is an AI enabled, multi organ biological age estimation system, a health report intelligence platform. Let me introduce the four people who built it.',cams:[[0,1024,576,1152,2048],[7000,1000,185,430,1700],[15500,1024,420,230,1950]]},
mem('Ashish Kumar','MC/25/018','Lead AI Developer & Architect',302,'Ashish Kumar, roll number MC/25/018, is the Lead AI Developer and Architect. In Bio-Revive, he designed the complete system: the generative AI engine, retrieval augmented generation that grounds every answer in real health data, the AI Trinity, and the cloud that runs it all. He also leads the futuristic software lab.'),
mem('Gudiya Kumari','MC/25/044','Frontend & UI/UX Scientist',787,'Gudiya Kumari, roll number MC/25/044, is the Frontend and UI/UX Scientist. She designs everything the user sees: the React and Next.js dashboards, clear visualisations of organ health, and the brain mapping interface. She turns complex medical numbers into a simple and beautiful experience.'),
mem('Harshvardhan Kumar','MC/25/004','Backend & AI Integration',1268,'Harshvardhan Kumar, roll number MC/25/004, handles Backend and AI Integration. He builds the engine room: FastAPI services, OCR that reads uploaded health reports, NLP and machine learning models, and the ESP32 hardware with edge AI that brings live sensor data into the platform.'),
mem('Saksham Keshri','MC/25/010','Data Analytics & Research Lead',1749,'Saksham Keshri, roll number MC/25/010, is the Data Analytics and Research Lead. He structures the medical data, defines the risk indicators, and develops the biological age analytics, so that every organ receives a score the team can trust.'),
{ch:'EPILOGUE',n:'Team Bio-Revive 360°',id:'JRU RANCHI · MCA 2026',r:'biorevive-jh9.caffeine.xyz',t:'Together, they turn a simple health report into a three sixty degree picture of how old your organs really are. This is Team Bio-Revive three sixty. Thank you for watching.',cams:[[0,1024,745,560,2000],[8000,1024,1085,130,1900],[13500,1024,576,1152,2048]]}];
SC.slice(1,5).forEach((s,i)=>s.ch='CHAPTER 0'+(i+1)+' · ROLE IN THE PROJECT');
const say=s=>s.replace(/MC\/25\/(\d)(\d)(\d)/g,(m,a,b,c)=>'M C, twenty five, '+[a,b,c].map(d=>['zero','one','two','three','four','five','six','seven','eight','nine'][d]).join(' ')).replace(/UI\/UX/g,'U I, U X').replace(/ESP32/g,'E S P thirty two').replace(/FastAPI/g,'Fast A P I').replace(/Next\.js/g,'Next J S').replace(/\bAI\b/g,'A I').replace(/\bOCR\b/g,'O C R').replace(/\bNLP\b/g,'N L P').replace(/JRU/g,'J R U').replace(/360/g,'three sixty');
/* camera */
const stage=$('stage');let lastCam=SC[0].cams[0];
function cam(c){lastCam=c;const W=stage.clientWidth,H=stage.clientHeight,S=Math.min(H/c[3],W/c[4]);$('cam').style.transform=`translate(${W/2-c[1]*S}px,${H*.45-c[2]*S}px) scale(${S})`}
addEventListener('resize',()=>{const t=$('cam').style.transition;$('cam').style.transition='none';cam(lastCam);requestAnimationFrame(()=>$('cam').style.transition=t)});
cam(SC[0].cams[0]);
/* film grain + dust */
(function(){const k=document.createElement('canvas');k.width=k.height=160;const x=k.getContext('2d'),d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);$('grain').style.backgroundImage='url('+k.toDataURL()+')';
 const c=$('dust'),g=c.getContext('2d'),P=[];function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);for(let i=0;i<50;i++)P.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.4,s:.01+Math.random()*.03,a:.15+Math.random()*.4,p:Math.random()*6});
 (function f(t){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y-=p.s*.016;p.x+=Math.sin(t/3000+p.p)*.0004;if(p.y<-.02)p.y=1.02;g.beginPath();g.fillStyle='rgba(255,236,190,'+p.a*(.6+.4*Math.sin(t/900+p.p))+')';g.arc(p.x*c.width,p.y*c.height,p.r,0,7);g.fill()});requestAnimationFrame(f)})(0)})();
/* score */
let AC=null,MB=null,MV=null,RV=null,snd=true,vox=true,ci=0;const CH=[[110,164.8,220,261.6,329.6],[87.3,130.8,174.6,220,261.6],[130.8,196,261.6,329.6,392],[98,146.8,196,246.9,293.7]];
function audio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();MV=AC.createGain();MV.gain.value=$('vl').value/100*.7;const cp=AC.createDynamicsCompressor();MV.connect(cp);cp.connect(AC.destination);MB=AC.createGain();MB.connect(MV);
 RV=AC.createConvolver();const ib=AC.createBuffer(2,AC.sampleRate*3.5,AC.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8)}RV.buffer=ib;const rg=AC.createGain();rg.gain.value=.9;RV.connect(rg);rg.connect(MB);
 chord();setInterval(chord,6000);setInterval(arp,500);setInterval(beat,2000)}
function chord(){if(!AC)return;const n=AC.currentTime,f=AC.createBiquadFilter(),ch=CH[ci++%4];f.type='lowpass';f.frequency.value=900;f.connect(MB);f.connect(RV);ch.forEach(q=>[-6,6].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=q;o.detune.value=dt;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.03,n+2.2);g.gain.linearRampToValueAtTime(.0001,n+7.4);o.connect(g);g.connect(f);o.start(n);o.stop(n+7.6)}))}
function arp(){if(!AC||Math.random()<.35)return;const q=CH[(ci+3)%4],fq=q[Math.floor(Math.random()*q.length)]*2,n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.05,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+1.4);o.connect(g);g.connect(MB);g.connect(RV);o.start(n);o.stop(n+1.5)}
function beat(){if(!AC)return;[0,.34].forEach((d,i)=>{const n=AC.currentTime+d,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=52;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16-.07*i,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.4);o.connect(g);g.connect(MB);o.start(n);o.stop(n+.45)})}
function impact(){if(!AC||!snd)return;const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(95,n);o.frequency.exponentialRampToValueAtTime(32,n+1);g.gain.setValueAtTime(.5,n);g.gain.exponentialRampToValueAtTime(.0001,n+1.3);o.connect(g);g.connect(MV);o.start(n);o.stop(n+1.4);
 const b=AC.createBuffer(1,AC.sampleRate*1.2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g2=AC.createGain();s.buffer=b;f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(400,n);f.frequency.exponentialRampToValueAtTime(4000,n+.5);g2.gain.setValueAtTime(.0001,n);g2.gain.exponentialRampToValueAtTime(.22,n+.45);g2.gain.exponentialRampToValueAtTime(.0001,n+1.1);s.connect(f);f.connect(g2);g2.connect(MV);s.start(n)}
const duck=on=>{if(MB)MB.gain.setTargetAtTime(on?.3:1,AC.currentTime,.6)};
/* natural female voice */
let VO=null;const pickV=()=>{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));for(const p of[/Aria|Jenny|Neerja|Natural/i,/Google UK English Female/i,/Samantha|Serena|Karen|Moira|Tessa|Veena|Ava|Allison|Susan/i,/Zira|Heera|Female|Google US English/i]){const m=v.find(x=>p.test(x.name));if(m)return m}return v[0]||null};
const TTS='speechSynthesis' in window;if(TTS){speechSynthesis.onvoiceschanged=()=>VO=pickV();VO=pickV()}
/* tour */
let step=-1,playing=false,tok=0,T=[];const clr=()=>{T.forEach(clearTimeout);T=[]};
$('chips').innerHTML=['Prologue','Ashish','Gudiya','Harsh','Saksham','Epilogue'].map((n,i)=>`<button class="btn" data-i="${i}">${n}</button>`).join('');
function showCap(s){const c=$('cap');c.style.opacity=0;setTimeout(()=>{c.textContent=s;c.style.opacity=1},200)}
function speak(txt,done){const my=++tok,sents=txt.match(/[^.!?]+[.!?]+/g)||[txt],sp=say(txt).match(/[^.!?]+[.!?]+/g)||[],voiced=vox&&TTS;let fin=false,cur=-1,acc=0;
 const show=k=>{if(k>cur&&my===tok){cur=k;showCap(sents[k].trim())}};
 const end=()=>{if(fin||my!==tok)return;fin=true;duck(false);done()};
 sents.forEach((s,k)=>{T.push(setTimeout(()=>show(k),acc));acc+=s.length*72+250});
 T.push(setTimeout(end,voiced?acc*1.7+5000:acc+2500));
 if(!voiced)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(say(txt));if(!VO)VO=pickV();if(VO){u.voice=VO;u.lang=VO.lang}u.rate=.93;u.pitch=1.06;
 u.onboundary=e=>{let p=0,k=0;sp.forEach((s,j)=>{if(e.charIndex>=p)k=j;p+=s.length});show(k)};u.onend=()=>{if(my===tok)T.push(setTimeout(end,1000))};duck(true);speechSynthesis.speak(u)}
function play(i){clr();if(i<0)i=0;if(i>=SC.length){playing=false;step=-1;$('bp').textContent='▶ Replay';$('lt').classList.remove('show');showCap('Team Bio-Revive 360° · JRU Ranchi · 2026');cam([0,1024,576,1152,2048]);return}
 step=i;playing=true;const s=SC[i];$('bp').textContent='⏸ Pause';document.querySelectorAll('#chips .btn').forEach((b,j)=>b.classList.toggle('on',j==i));$('pg').style.width=((i+1)/SC.length*100)+'%';
 $('lt').classList.remove('show');$('cap').style.opacity=0;const sw=$('sw');sw.classList.remove('go');void sw.offsetWidth;sw.classList.add('go');impact();
 s.cams.forEach(c=>T.push(setTimeout(()=>cam(c),c[0])));
 T.push(setTimeout(()=>{$('lt').innerHTML=`<small>${s.ch}</small><b>${s.n}</b><span>${s.r}</span>${s.id?'<em>'+s.id+'</em>':''}`;$('lt').classList.add('show')},1400));
 T.push(setTimeout(()=>speak(s.t,()=>{if(playing&&step==i)T.push(setTimeout(()=>play(i+1),300))}),1800))}
function pause(){playing=false;clr();tok++;if(TTS)speechSynthesis.cancel();duck(false);$('bp').textContent='▶ Play'}
$('go').onclick=()=>{audio();$('start').classList.add('hide');play(0)};
$('bp').onclick=()=>{audio();playing?pause():play(step<0?0:step)};$('bn').onclick=()=>{audio();play(step+1>=SC.length?0:step+1)};$('bv').onclick=()=>{audio();play(Math.max(0,step-1))};
$('chips').onclick=e=>{const b=e.target.closest('.btn');if(b){audio();play(+b.dataset.i)}};
$('bs').onclick=()=>{audio();snd=!snd;$('bs').classList.toggle('on',snd);if(MV)MV.gain.value=snd?$('vl').value/100*.7:0};$('vl').oninput=()=>{if(MV&&snd)MV.gain.value=$('vl').value/100*.7};
$('bm').onclick=()=>{vox=!vox;$('bm').classList.toggle('on',vox);if(!vox&&TTS)speechSynthesis.cancel()};
let cin=false,idle;function poke(){document.body.classList.remove('idle');clearTimeout(idle);if(cin)idle=setTimeout(()=>document.body.classList.add('idle'),3000)}
function cinema(v){cin=v===undefined?!cin:v;document.body.classList.toggle('cin',cin);$('bc').classList.toggle('on',cin);const d=document.documentElement;if(cin){(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);poke()}else if(document.fullscreenElement)document.exitFullscreen()}
$('bc').onclick=()=>cinema();addEventListener('pointermove',poke);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&cin)cinema(false)});
addEventListener('keydown',e=>{const k=e.key;if(k=='c'||k=='C')cinema();else if(k=='Escape'&&cin)cinema(false);else if(k==' '){e.preventDefault();$('bp').onclick()}else if(k=='ArrowRight')$('bn').onclick();else if(k=='ArrowLeft')$('bv').onclick();else if(k=='m'||k=='M')$('bs').onclick()});
</script></body></html>
